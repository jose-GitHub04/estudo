<title>Testes do widget limites</title>
<!-- Testes do widget «limites» (Limites e assíntotas, widgets/limites.js).
     Sem parâmetros corre os testes: abrir /logaritmos/tests/limites.html ou
       msedge --headless=new --virtual-time-budget=60000 --dump-dom http://127.0.0.1:8817/logaritmos/tests/limites.html
     O resultado fica no elemento pre#resultado e no atributo data-testes (ok ou falhou) do elemento html.
     O que se confere:
       1. formatação científica (arredondamento «metade para cima», vírgula, expoente);
       2. todas as tabelas (eˣ/xᵖ para p = 1, 1,5, ..., 10 com 9 valores de x; ln x/xᵖ; x ln x; os dois
          limites em 0; as tabelas das assíntotas) contra valores de referência calculados fora do site
          (mpmath, 60 algarismos) e contra o cálculo direto em dupla precisão;
       3. o ponto em que eˣ > xᵖ passa a valer para sempre, para p = 1, 1,5, ..., 10 (com x-1 e x);
       4. os mínimos e máximos citados: mínimo de eˣ/xᵖ em x = p, máximo de ln x/xᵖ em x = e^(1/p),
          mínimo de x ln x em 1/e, máximo de ln x/x em e;
       5. o widget montado: sem erros, cabeçalhos de tabela, aria-valuetext nos sliders, alvos de 44 px,
          interações (slider de p, meios, cursor com o teclado, chips das assíntotas).
     Com ?demo=<aba> monta só o widget para screenshots (marca <html data-demo="pronto">):
       exp | ln | xlnx | notaveis | assintotas, e opcionalmente
       &p=<n> (aba exp: valor de p; &meios=1 liga os meios), &pl=<p> (aba ln), &log=1 (aba xlnx em escala log),
       &fn=g&sub=zero|mais|menos (assíntotas), &x=<valor do slider de x>.
     Com ?estouro=1&w=390 percorre todos os estados numa largura de telemóvel e lista o que não cabe. -->

// ---------------------------------------------------------------- utilitários
const falhas = [];
let n = 0;
const ok = (cond, msg) => { n++; if (!cond) falhas.push(msg); };
const igual = (a, b, msg) => ok(a === b, `${msg}: obtido «${a}», esperado «${b}»`);
const perto = (a, b, tol, msg) => ok(
  Number.isFinite(a) && Math.abs(a - b) <= tol * (b === 0 ? 1 : Math.abs(b)),
  `${msg}: obtido ${a}, esperado ${b} (tolerância relativa ${tol})`);
const ps = []; for (let i = 2; i <= 20; i++) ps.push(i / 2); // 1, 1,5, ..., 10
const chave = (p) => String(p);                                // «5», «2.5»
const chaveCruz = (p) => p.toFixed(1);                         // «5.0», «2.5»

function tabelaContra(nome, obtido, esperado) {
  igual(obtido.length, esperado.length, `${nome}: número de linhas`);
  obtido.forEach((l, i) => {
    const e = esperado[i];
    if (!e) return;
    igual(l.cels.length, e.length, `${nome}[${i}]: número de colunas`);
    l.cels.forEach((c, j) => igual(c, e[j], `${nome}[${i}][${j}]`));
  });
}

// ---------------------------------------------------------------- 1. formatação

    [1.2e19, '1{,}2\\times10^{19}', '1,2×10¹⁹', '1,2 vezes 10 elevado a 19'],
    [1e19, '10^{19}', '10¹⁹', '10 elevado a 19'],
    [2.718281828, '2{,}72', '2,72', '2,72'],
    [Math.exp(5) / 3125, '0{,}0475', '0,0475', '0,0475'],
    [148.4131591, '148', '148', '148'],
    [1234.5, '1{,}23\\times10^{3}', '1,23×10³', '1,23 vezes 10 elevado a 3'],
    [999.6, '10^{3}', '10³', '10 elevado a 3'],
    [999.4, '999', '999', '999'],
    [3125, '3{,}13\\times10^{3}', '3,13×10³', '3,13 vezes 10 elevado a 3'],
    [9996, '10^{4}', '10⁴', '10 elevado a 4'],
    [0.0099996, '0{,}01', '0,01', '0,01'],
    [0.00999, '9{,}99\\times10^{-3}', '9,99×10⁻³', '9,99 vezes 10 elevado a menos 3'],
    [-1.3815510557964274e-5, '-1{,}38\\times10^{-5}', '−1,38×10⁻⁵', 'menos 1,38 vezes 10 elevado a menos 5'],
    [0, '0', '0', '0'],
    [1.125, '1{,}13', '1,13', '1,13'],          // empate exato: arredonda a metade para cima
    [2.675, '2{,}67', '2,67', '2,67'],          // em binário 2,675 é 2,67499...
    [Math.exp(700), '1{,}01\\times10^{304}', '1,01×10³⁰⁴', '1,01 vezes 10 elevado a 304'],
    [-2.5, '-2{,}5', '−2,5', 'menos 2,5'],
    [10, '10', '10', '10'],
    [999999.6, '10^{6}', '10⁶', '10 elevado a 6'],
    [123456, '1{,}23\\times10^{5}', '1,23×10⁵', '1,23 vezes 10 elevado a 5'],
    [0.1, '0{,}1', '0,1', '0,1'],
    [0.015, '0{,}015', '0,015', '0,015'],
    [1e-6, '10^{-6}', '10⁻⁶', '10 elevado a menos 6'],
    [3.6e275, '3{,}6\\times10^{275}', '3,6×10²⁷⁵', '3,6 vezes 10 elevado a 275'],

  for (const [v, t, s, f] of casos) {

  // mantissa e expoente

  c = L.cientifico(9.996e5);
  ok(c.mant === '1' && c.exp === 6, `cientifico(9,996e5) tem de passar para 1×10^6: ${JSON.stringify(c)}`);
  c = L.cientifico(-4.5e-7);
  ok(c.mant === '4,5' && c.exp === -7, `cientifico(-4,5e-7) = ${JSON.stringify(c)}`);
  // x das tabelas
  const xs = [[1000, '10^{3}'], [1e-3, '10^{-3}'], [-1e-3, '-10^{-3}'], [100, '100'], [0.01, '0{,}01'], [1e12, '10^{12}'],
    [0, '0'], [1e6, '10^{6}'], [-1, '-1'], [0.1, '0{,}1'], [700, '700'], [300, '300'], [-0.1, '-0{,}1']];
  for (const [x, t] of xs) igual(L.xTex(x), t, `xTex(${x})`);
  igual(L.decTex(1.0005001667, 6), '1{,}000500', 'decTex(1,0005001667; 6)');

// ---------------------------------------------------------------- 2. tabelas
function testarTabelas() {
  // 2.1 eˣ/xᵖ: 9 valores de x para cada p de 1 a 10 (de meio em meio)
  for (const p of ps) {
    tabelaContra(`tabela exp p=${p}`, L.linhasTabelaExp(p), REF.exp[chave(p)]);
    // cálculo direto, em dupla precisão e por outro caminho (exp(x - p ln x))
    for (const l of L.linhasExp(p)) {
      perto(l.ex, Math.exp(l.x), 1e-15, `e^${l.x}`);
      perto(l.xp, Math.pow(l.x, p), 1e-15, `${l.x}^${p}`);
      perto(l.q, Math.exp(l.x - p * Math.log(l.x)), 1e-12, `e^x/x^p em x=${l.x}, p=${p}`);
      ok(Number.isFinite(l.ex) && Number.isFinite(l.xp) && Number.isFinite(l.q), `valores finitos em x=${l.x}, p=${p}`);
      if (Number.isInteger(p)) {
        const exato = Number(BigInt(l.x) ** BigInt(p)); // potência inteira exata
        perto(l.xp, exato, 1e-15, `${l.x}^${p} exato (BigInt)`);
      }
    }
    // a classe marca as linhas em que e^x > x^p
    L.linhasTabelaExp(p).forEach((lin, i) => {
      const q = L.linhasExp(p)[i].q;
      ok((lin.classe === 'li-ganha') === (q > 1), `classe da linha ${i} em p=${p}`);
    });
  }
  // 2.2 muitos pontos: 60 valores de x entre 0,5 e 700 (geométricos) para p = 3, 7, 10
  for (const p of [3, 7, 10]) {
    const xs = []; for (let i = 0; i < 60; i++) xs.push(0.5 * Math.pow(1400, i / 59));
    for (const l of L.linhasExp(p, xs)) perto(l.q, Math.exp(l.x - p * Math.log(l.x)), 1e-12, `quociente em x=${l.x}, p=${p}`);
  }
  // 2.3 ln x / x^p
  for (const p of L.P_LN) {
    tabelaContra(`tabela ln p=${p}`, L.linhasTabelaLn(p), REF.ln[chave(p)]);
    for (const t of L.T_LN) {
      const x = Math.pow(10, t);
      perto(L.quocienteLn(p, x), Math.log(x) * Math.pow(x, -p), 1e-12, `ln x/x^p com x=10^${t}, p=${p}`);
      perto(L.quocienteLnT(p, t), L.quocienteLn(p, x), 1e-12, `forma em t, p=${p}, t=${t}`);
    }
  }
  // 2.4 x ln x
  tabelaContra('tabela x ln x', L.linhasTabelaXlnx(), REF.xlnx);
  for (const x of L.X_XLNX) ok(L.xlnx(x) < 0 && Math.abs(L.xlnx(x) - x * Math.log(x)) === 0, `x ln x em ${x} é negativo`);
  // 2.5 os dois limites em 0
  tabelaContra('tabela limites em 0', L.linhasTabelaNotaveis(), REF.notaveis);
  const serieExp = (x) => { let s = 0; let t = 1; for (let k = 0; k < 40; k++) { s += t; t *= x / (k + 2); } return s; }; // Σ x^k/(k+1)!
  const serieLn = (x) => { let s = 0; let t = 1; for (let k = 0; k < 400; k++) { s += t / (k + 1); t *= -x; } return s; }; // Σ (−1)^k x^k/(k+1)
  for (const x of [-0.1, -0.01, -1e-3, 1e-3, 0.01, 0.1, -1, 1]) {
    perto(L.expm1X(x), serieExp(x), 1e-13, `(e^x-1)/x em x=${x} contra a série`);
    if (Math.abs(x) <= 0.1) perto(L.log1pX(x), serieLn(x), 1e-12, `ln(1+x)/x em x=${x} contra a série`);
  }
  perto(L.log1pX(1), Math.LN2, 1e-15, 'ln(1+1)/1 = ln 2');
  perto(L.expm1X(1), Math.E - 1, 1e-15, '(e^1-1)/1 = e-1');
  ok(Number.isNaN(L.log1pX(-1)) && Number.isNaN(L.log1pX(0)) && Number.isNaN(L.expm1X(0)), 'ln(1+x)/x não existe em x=-1 nem em 0; (e^x-1)/x não existe em 0');
  // cancelamento: com x = 1e-10 a fórmula ingénua perde quase tudo; expm1 e log1p não
  const ingenuo = (Math.exp(1e-10) - 1) / 1e-10;
  ok(Math.abs(ingenuo - 1) > 1e-9 + 5e-11 || Math.abs(ingenuo - (1 + 5e-11)) > 1e-12, 'a fórmula ingénua perde precisão com x=1e-10 (é por isso que se usa expm1)');
  perto(L.expm1X(1e-10) - 1, 5e-11, 1e-6, 'expm1X(1e-10) - 1 ≈ x/2');
  perto(L.log1pX(1e-10) - 1, -5e-11, 1e-6, 'log1pX(1e-10) - 1 ≈ -x/2');
  // 2.6 assíntotas
  const sf = L.FUNCOES5.f.sentidos; const sg = L.FUNCOES5.g.sentidos;
  tabelaContra('f, x→+∞', sf[0].xs.map((x) => ({ cels: sf[0].cels(x) })), REF.f_mais);
  tabelaContra('f, x→-∞', sf[1].xs.map((x) => ({ cels: sf[1].cels(x) })), REF.f_menos);
  tabelaContra('g, x→0+', sg[0].xs.map((x) => ({ cels: sg[0].cels(x) })), REF.g_zero);
  tabelaContra('g, x→+∞', sg[1].xs.map((x) => ({ cels: sg[1].cels(x) })), REF.g_mais);
  for (const x of [1, 2, 5, 10]) {
    perto(L.difF(x), L.F5(x) - x, 1e-9, `f(x)-x = e^-x em x=${x}`);
    perto(L.razaoF(x), L.F5(x) / x, 1e-12, `f(x)/x em x=${x}`);
  }
  for (const x of [-1, -5, -10, -20]) perto(L.razaoF(x), L.F5(x) / x, 1e-12, `f(x)/x em x=${x}`);
}

// ---------------------------------------------------------------- 3. onde e^x passa x^p
function testarCruzamentos() {
  for (const p of ps) {
    const c = L.cruzamentoExp(p);
    const r = REF.cruz[chaveCruz(p)];
    igual(c.sempre, r.sempre, `p=${p}: «sempre»`);
    perto(c.minimo, r.minimo, 1e-12, `p=${p}: mínimo de e^x/x^p em x=p, (e/p)^p`);
    perto(c.minimo, Math.exp(p) / Math.pow(p, p), 1e-12, `p=${p}: (e/p)^p = e^p/p^p`);
    if (c.sempre) {
      ok(p < Math.E, `p=${p}: só p < e tem «sempre»`);
      ok(c.minimo > 1, `p=${p}: com «sempre» o mínimo do quociente tem de ser maior que 1`);
      let todos = true;
      for (let x = 0.01; x <= 700; x += 0.07) if (!(Math.exp(x) > Math.pow(x, p))) { todos = false; break; }
      ok(todos, `p=${p}: e^x > x^p para todo o x em ]0, 700]`);
      continue;
    }
    ok(p > Math.E && c.minimo < 1, `p=${p}: com cruzamentos o mínimo do quociente tem de ser menor que 1`);
    perto(c.x2, r.x2, 1e-12, `p=${p}: x2 (cruzamento final)`);
    perto(c.x1, r.x1, 1e-12, `p=${p}: x1 (primeiro cruzamento)`);
    igual(c.n, r.n, `p=${p}: inteiro n`);
    // o teste «com x-1 e x»
    const n1 = c.n - 1;
    ok(n1 >= p, `p=${p}: x-1 (=${n1}) está depois do mínimo, onde o quociente só sobe`);
    ok(Math.exp(n1) < Math.pow(n1, p), `p=${p}: e^${n1} < ${n1}^p ainda`);
    ok(Math.exp(c.n) > Math.pow(c.n, p), `p=${p}: e^${c.n} > ${c.n}^p já`);
    // e daí para a frente nunca mais perde (até onde o double deixa: 700)
    let sempreDepois = true;
    for (let x = c.n; x <= 700; x += 0.31) if (!(Math.exp(x) > Math.pow(x, p))) { sempreDepois = false; break; }
    ok(sempreDepois, `p=${p}: e^x > x^p para todo o x em [${c.n}, 700]`);
    // entre x1 e x2 a potência está à frente; antes de x1 a exponencial também
    let meio = true;
    for (let i = 1; i < 40; i++) { const x = c.x1 + ((c.x2 - c.x1) * i) / 40; if (!(Math.exp(x) < Math.pow(x, p))) { meio = false; break; } }
    ok(meio, `p=${p}: e^x < x^p entre x1 e x2`);
    let antes = true;
    for (let x = 0.01; x < c.x1 - 0.005; x += 0.01) if (!(Math.exp(x) > Math.pow(x, p))) { antes = false; break; }
    ok(antes, `p=${p}: e^x > x^p antes de x1`);
  }
  // valores citados nos textos: p = 3 (x≈4,54; 4 e 5), p = 5 (x≈12,7; 12 e 13), p = 10 (x≈35,8; 35 e 36)
  const c3 = L.cruzamentoExp(3); const c5 = L.cruzamentoExp(5); const c10 = L.cruzamentoExp(10);
  ok(Math.abs(c3.x2 - 4.5364) < 5e-5 && c3.n === 5, `p=3: x2=${c3.x2}, n=${c3.n}`);
  ok(Math.abs(c5.x2 - 12.7131) < 5e-4 && c5.n === 13, `p=5: x2=${c5.x2}, n=${c5.n}`);
  ok(Math.abs(c10.x2 - 35.7715) < 5e-5 && c10.n === 36, `p=10: x2=${c10.x2}, n=${c10.n}`);
  ok(Math.exp(12) < Math.pow(12, 5) && Math.exp(13) > Math.pow(13, 5), 'p=5: e^12 < 12^5 e e^13 > 13^5');
  ok(Math.exp(35) < Math.pow(35, 10) && Math.exp(36) > Math.pow(36, 10), 'p=10: e^35 < 35^10 e e^36 > 36^10');
}

// ---------------------------------------------------------------- 4. mínimos e máximos citados
function testarExtremos() {
  // eˣ/xᵖ tem o mínimo em x = p (em x > 0), de valor (e/p)^p
  for (const p of ps) {
    let melhor = Infinity; let em = 0;
    for (let x = 0.5; x <= 700; x += 0.005) { const v = L.log10QuocExp(p, x); if (v < melhor) { melhor = v; em = x; } }
    ok(Math.abs(em - p) <= 0.006, `p=${p}: mínimo de e^x/x^p em x=${em}, esperado ${p}`);
    perto(melhor, p * Math.log10(Math.E / p), 1e-9, `p=${p}: valor mínimo de log10(e^x/x^p)`);
    ok(L.log10QuocExp(p, p - 0.2) > L.log10QuocExp(p, p) && L.log10QuocExp(p, p + 0.2) > L.log10QuocExp(p, p), `p=${p}: desce até x=p e sobe depois`);
    // log10 do quociente = log10 do quociente calculado diretamente (onde não estoura)
    for (const x of [1, 5, 10, 50]) perto(L.log10QuocExp(p, x), Math.log10(Math.exp(x) / Math.pow(x, p)), 1e-12, `log10(e^x/x^p) em x=${x}, p=${p}`);
  }
  // ln x / x^p: máximo em x = e^(1/p), de valor 1/(p e); depois desce para 0
  for (const p of L.P_LN) {
    const m = L.maximoLn(p);
    perto(m.x, REF.lnmax[chave(p)].x, 1e-12, `p=${p}: x do máximo`);
    perto(m.y, REF.lnmax[chave(p)].y, 1e-12, `p=${p}: valor do máximo`);
    let melhor = -Infinity; let em = 0;
    for (let t = 0; t <= 12; t += 0.0005) { const v = L.quocienteLnT(p, t); if (v > melhor) { melhor = v; em = t; } }
    ok(Math.abs(em - Math.log10(m.x)) <= 0.001, `p=${p}: máximo de ln x/x^p em log10 x=${em}, esperado ${Math.log10(m.x)}`);
    perto(melhor, m.y, 1e-6, `p=${p}: valor do máximo, varrendo t`);
    // depois do máximo desce sempre (amostrado) e acaba abaixo do máximo
    let desce = true; let ant = Infinity;
    for (let t = Math.log10(m.x) + 0.01; t <= 12; t += 0.05) { const v = L.quocienteLnT(p, t); if (!(v < ant)) { desce = false; break; } ant = v; }
    ok(desce, `p=${p}: ln x/x^p desce depois do máximo`);
    ok(L.quocienteLnT(p, 12) < m.y, `p=${p}: em x=10^12 está abaixo do máximo`);
  }
  // x ln x: mínimo em 1/e, de valor -1/e; tende para 0 por valores negativos
  {
    let melhor = Infinity; let em = 0;
    for (let x = 1e-6; x <= 1; x += 0.00001) { const v = L.xlnx(x); if (v < melhor) { melhor = v; em = x; } }
    ok(Math.abs(em - 1 / Math.E) <= 1e-4, `mínimo de x ln x em x=${em}, esperado ${1 / Math.E}`);
    perto(melhor, -1 / Math.E, 1e-8, 'valor do mínimo de x ln x');
    perto(L.minimoXlnx.x, 1 / Math.E, 1e-15, 'minimoXlnx.x'); perto(L.minimoXlnx.y, -1 / Math.E, 1e-15, 'minimoXlnx.y');
    let neg = true; let ant = 0;
    for (let k = 1; k <= 12; k++) { const v = L.xlnx(Math.pow(10, -k)); if (!(v < 0 && Math.abs(v) < Math.abs(ant || -Infinity) + 1)) neg = false; ant = v; }
    ok(neg, 'x ln x < 0 em 10^-k');
    let encolhe = true;
    for (let k = 2; k <= 12; k++) if (!(Math.abs(L.xlnx(Math.pow(10, -k))) < Math.abs(L.xlnx(Math.pow(10, -(k - 1)))))) encolhe = false;
    ok(encolhe, '|x ln x| encolhe quando x = 10^-k desce');
    ok(Math.abs(L.xlnx(1e-6)) < 1.4e-5 && Math.abs(L.xlnx(1e-6)) > 1.38e-5, `x ln x em 1e-6 vale ${L.xlnx(1e-6)}`);
  }
  // g(x) = ln x / x: máximo em x = e, de valor 1/e
  {
    let melhor = -Infinity; let em = 0;
    for (let x = 0.01; x <= 50; x += 0.0005) { const v = L.G5(x); if (v > melhor) { melhor = v; em = x; } }
    ok(Math.abs(em - Math.E) <= 0.001, `máximo de ln x/x em x=${em}, esperado e`);
    perto(melhor, 1 / Math.E, 1e-7, 'valor do máximo de ln x/x');
    perto(L.G5(Math.E), 1 / Math.E, 1e-15, 'g(e) = 1/e');
    ok(L.G5(0.01) < -400 && L.G5(1e-6) < -1e7, 'g(x) → -∞ quando x → 0+');
    ok(L.G5(1e12) > 0 && L.G5(1e12) < 3e-11, 'g(x) → 0 quando x → +∞');
    perto(L.G5(1e12) / 1e12, Math.log(1e12) / 1e24, 1e-12, 'g(x)/x = ln x / x^2');
  }
  // f(x) = x + e^-x: mínimo em x = 0 (valor 1), f(x) - x = e^-x → 0; m = 1, b = 0 em +∞; m → -∞ em -∞
  {
    let melhor = Infinity; let em = 0;
    for (let x = -2.5; x <= 6.5; x += 0.001) { const v = L.F5(x); if (v < melhor) { melhor = v; em = x; } }
    ok(Math.abs(em) <= 0.002 && Math.abs(melhor - 1) < 1e-6, `mínimo de f em x=${em}, valor ${melhor}`);
    ok(Math.abs(L.razaoF(1e6) - 1) < 1e-6 && L.difF(40) < 1e-17, 'm = 1 e b = 0 em +∞');
    ok(L.razaoF(-20) < -1e6 && L.razaoF(-40) < L.razaoF(-20), 'f(x)/x → -∞ em -∞');
  }
}

// ---------------------------------------------------------------- 5. o widget montado
const esperar = (ms = 0) => new Promise((r) => setTimeout(r, ms));
const evento = (el, valor) => { el.value = String(valor); el.dispatchEvent(new Event('input', { bubbles: true })); };
const chip = (raiz, id) => raiz.querySelector(`.chip[data-id="${id}"]`);
// o que se vê (sem a versão MathML escondida do KaTeX)
const visivel = (el) => { const c = el.cloneNode(true); c.querySelectorAll('.katex-mathml').forEach((m) => m.remove()); return c.textContent.replace(/\s+/g, ' ').trim(); };

function verificarAba(w, palco, id) {
  const painel = palco.querySelector(`.li-aba[data-aba="${id}"]`);
  ok(painel && !painel.hidden, `${id}: painel visível`);
  if (!painel) return null;
  ok(!!painel.querySelector('svg.figura'), `${id}: tem gráfico`);
  ok((painel.querySelector('svg.figura').getAttribute('aria-label') || '').length > 20, `${id}: gráfico com aria-label`);
  ok(painel.querySelectorAll('.tabela-rolante > table > thead th[scope="col"]').length >= 3, `${id}: tabela com cabeçalhos de coluna`);
  ok(painel.querySelectorAll('.tabela-rolante > table > tbody th[scope="row"]').length >= 4, `${id}: tabela com cabeçalhos de linha`);
  ok(!/NaN|undefined|Infinity|null/.test(painel.textContent), `${id}: texto sem NaN/undefined/Infinity: ${(painel.textContent.match(/.{0,20}(NaN|undefined|Infinity|null).{0,20}/) || [''])[0]}`);
  ok(!/NaN/.test(painel.querySelector('svg.figura').outerHTML), `${id}: SVG sem NaN`);
  ok(painel.querySelectorAll('.katex-error').length === 0, `${id}: sem erros do KaTeX`);
  ok(painel.querySelectorAll('.katex').length >= 5, `${id}: fórmulas desenhadas (${painel.querySelectorAll('.katex').length})`);
  for (const s of painel.querySelectorAll('input[type="range"]')) {
    ok((s.getAttribute('aria-valuetext') || '').length > 2, `${id}: slider com aria-valuetext`);
    ok(s.getBoundingClientRect().height >= 43.9, `${id}: slider com alvo de toque >= 44 px (${s.getBoundingClientRect().height})`);
    ok(!!s.labels && s.labels.length === 1, `${id}: slider com label`);
  }
  for (const b of painel.querySelectorAll('button.chip')) ok(b.getBoundingClientRect().height >= 43.9, `${id}: chip com alvo >= 44 px (${b.getBoundingClientRect().height})`);
  ok(!!painel.querySelector('[aria-live="polite"]'), `${id}: leitura em aria-live`);
  ok(!!painel.querySelector('.li-conclusao .li-texto') && !!painel.querySelector('.li-regra .li-texto'), `${id}: conclusão e regra`);
  // o cursor
  const cursor = painel.querySelector('svg.figura [role="slider"]');
  ok(!!cursor && cursor.getAttribute('tabindex') === '0' && !!cursor.getAttribute('aria-valuetext'), `${id}: cursor focável com aria-valuetext`);
  return painel;
}

function carregar(el, tecla) {
  el.dispatchEvent(new KeyboardEvent('keydown', { key: tecla, bubbles: true, cancelable: true }));
}

async function testarWidget() {

  igual(cp.step, '0.5', 'passo do p com meios');
  evento(cp, 2.5);
  ok(/2,5/.test(P.querySelector('output[for$="-p"]').textContent), 'p = 2,5 no slider');
  ok(/todo o/.test(mais()), `exp p=2,5: «sempre» (2,5 < e): ${mais()}`);
  evento(cp, 3.5);

  igual(cp.step, '1', 'passo do p sem meios');
  ok(Number.isInteger(Number(cp.value)), `sem meios o p volta a inteiro (${cp.value})`);
  evento(cp, 5);
  // slider de x e cursor
  const cx = P.querySelector('input[id$="-x"]');
  const estado = () => P.querySelector('.li-estado').textContent;
  evento(cx, 5);
  ok(/potência ainda está à frente/.test(estado()), `exp x=5: ${estado()}`);
  evento(cx, cx.max);
  ok(/exponencial já está à frente/.test(estado()), `exp x=máx: ${estado()}`);
  const cur = P.querySelector('svg.figura [role="slider"]');
  const antes = cur.getAttribute('aria-valuenow');
  carregar(cur, 'ArrowLeft'); carregar(cur, 'ArrowLeft'); carregar(cur, 'ArrowLeft');
  ok(Number(cur.getAttribute('aria-valuenow')) < Number(antes), `exp: setas movem o cursor (${antes} -> ${cur.getAttribute('aria-valuenow')})`);
  ok(Math.abs(Number(cx.value) - Number(cur.getAttribute('aria-valuenow'))) <= 0.26, `exp: o slider acompanha o cursor (${cx.value} vs ${cur.getAttribute('aria-valuenow')})`);
  carregar(cur, 'Home');
  ok(Number(cur.getAttribute('aria-valuenow')) <= 0.5001, 'exp: Home leva o cursor ao início');
  const leit = [...P.querySelectorAll('.li-leituras .leitura__valor')].map((e) => e.textContent);
  ok(leit.length === 4 && leit.every((t) => t.trim().length > 0), `exp: 4 leituras preenchidas: ${leit.join(' | ')}`);

  // --- aba 2
  w.aba('ln');
  P = verificarAba(w, palco, 'ln');
  igual(P.querySelectorAll('tbody tr').length, 5, 'ln: 5 linhas');
  igual(P.querySelectorAll('.li-extra .chip').length, 5, 'ln: 5 chips de p');
  chip(P, 0.1).click();
  igual(chip(P, 0.1).getAttribute('aria-pressed'), 'true', 'ln: p=0,1 marcado');
  ok(/2,2 ?× ?10 ?4/.test(visivel(P.querySelector('.li-mais'))) && /3,68/.test(visivel(P.querySelector('.li-mais'))), `ln p=0,1: máximo em x≈2,2×10^4 e valor 3,68: ${visivel(P.querySelector('.li-mais'))}`);
  chip(P, 2).click();
  ok(/1,65/.test(visivel(P.querySelector('.li-mais'))) && /0,184/.test(visivel(P.querySelector('.li-mais'))), `ln p=2: máximo em 1,65 de valor 0,184: ${visivel(P.querySelector('.li-mais'))}`);
  const cxl = P.querySelector('input[id$="-x"]');
  evento(cxl, 12);
  igual(P.querySelector('output[for$="-x"]').textContent, 'x = 10¹²', 'ln: x = 10^12 no slider');
  igual(cxl.getAttribute('aria-valuetext'), 'x igual a 10 elevado a 12', 'ln: aria-valuetext em x = 10^12');
  ok(/descer/.test(P.querySelector('.li-estado').textContent), `ln x=10^12: ${P.querySelector('.li-estado').textContent}`);

  // --- aba 3
  w.aba('xlnx');
  P = verificarAba(w, palco, 'xlnx');
  igual(P.querySelectorAll('tbody tr').length, 4, 'xlnx: 4 linhas');
  const svg1 = P.querySelector('svg.figura').outerHTML;
  chip(P, 'log').click();
  ok(P.querySelector('svg.figura').outerHTML !== svg1, 'xlnx: a escala logarítmica muda o gráfico');
  igual(chip(P, 'log').getAttribute('aria-pressed'), 'true', 'xlnx: escala log marcada');
  evento(P.querySelector('input[id$="-x"]'), -6);
  ok(/negativo/.test(P.querySelector('.li-estado').textContent), `xlnx x=1e-6: ${P.querySelector('.li-estado').textContent}`);
  evento(P.querySelector('input[id$="-x"]'), 0);
  ok(/ln ?1 ?= ?0/.test(visivel(P.querySelector('.li-estado'))), `xlnx x=1: ${visivel(P.querySelector('.li-estado'))}`);

  // --- aba 4
  w.aba('notaveis');
  P = verificarAba(w, palco, 'notaveis');
  igual(P.querySelectorAll('tbody tr').length, 9, 'notaveis: 9 linhas');
  ok(/não existe/.test(P.querySelector('tbody').textContent), 'notaveis: «não existe» em x=-1');
  const ck = P.querySelector('input[id$="-x"]');
  evento(ck, 0);
  ok(/0/.test(P.querySelector('.li-estado').textContent) && /limite existe/.test(P.querySelector('.li-estado').textContent), `notaveis x=0: ${P.querySelector('.li-estado').textContent}`);
  evento(ck, -31);
  ok(/não existe/.test(P.querySelector('.li-leituras').textContent), 'notaveis x=-1: segundo quociente não existe');
  evento(ck, 31);

  // --- aba 5
  w.aba('assintotas');

  ok(/não há assíntota oblíqua/.test(P.querySelector('.li-conclusao').textContent), 'assintotas f-: conclusão sem assíntota');
  chip(P, 'g').click();
  igual(chip(P, 'g').getAttribute('aria-pressed'), 'true', 'assintotas: g marcada');
  igual(P.querySelectorAll('tbody tr').length, 4, 'assintotas g 0+: 4 linhas');
  ok(/assíntota vertical/.test(P.querySelector('.li-conclusao').textContent), 'assintotas g 0+: vertical');
  chip(P, 'mais').click();
  igual(P.querySelectorAll('tbody tr').length, 5, 'assintotas g +∞: 5 linhas');
  ok(/horizontal/.test(P.querySelector('.li-conclusao').textContent), 'assintotas g +∞: horizontal');
  chip(P, 'f').click();
  igual(P.querySelectorAll('tbody tr').length, 5, 'assintotas voltou a f+');
  ok(/oblíqua/.test(P.querySelector('.li-conclusao').textContent), 'assintotas f+: oblíqua');
  const cxa = P.querySelector('input[id$="-x"]');
  evento(cxa, 3);
  ok(/0,0498/.test(visivel(P.querySelector('.li-estado'))), `assintotas f x=3: f(x)-x = e^-3 ≈ 0,0498: ${visivel(P.querySelector('.li-estado'))}`);

  // ao mudar de aba, o painel anterior fica escondido e só há um visível
  w.aba('exp');
  igual(palco.querySelectorAll('.li-aba:not([hidden])').length, 1, 'só um painel visível');
  igual(palco.querySelectorAll('.li-abas .chip[aria-pressed="true"]').length, 1, 'só um chip de aba marcado');
  // um widget completo sem scroll horizontal da página
  ok(document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1, `sem scroll horizontal (${document.documentElement.scrollWidth} > ${document.documentElement.clientWidth})`);
}

// ---------------------------------------------------------------- demo
async function demo() {
  document.body.dataset.modo = 'demo';
  const palco = document.getElementById('palco');
  const w = await montar(palco, {});
  const aba = params.get('demo');
  w.aba(aba);
  const P = palco.querySelector(`.li-aba[data-aba="${aba}"]`);
  const x = (id) => P.querySelector(`input[id$="${id}"]`);
  if (aba === 'exp') {
    if (params.get('meios')) P.querySelector('.li-extra .chips .chip').click();
    if (params.get('p')) evento(x('-p'), params.get('p'));
  }
  if (aba === 'ln' && params.get('pl')) chip(P, params.get('pl')).click();
  if (aba === 'xlnx' && params.get('log')) chip(P, 'log').click();
  if (aba === 'assintotas') {
    if (params.get('fn')) chip(P, params.get('fn')).click();
    if (params.get('sub')) chip(P, params.get('sub')).click();
  }
  if (params.get('x')) evento(x('-x'), params.get('x'));
  await esperar(50);
  document.documentElement.dataset.demo = erros.length ? 'erro' : 'pronto';
  if (erros.length) document.getElementById('resultado').textContent = erros.join('\n');
}

// ---------------------------------------------------------------- largura de telemóvel
// ?estouro=1&w=390: força a largura do <body> e percorre todas as abas e estados à procura de
// elementos que saiam do ecrã, tabelas que precisem de rolar e fórmulas que não caibam.
async function estouro() {
  const W = Number(params.get('w')) || 390;
  document.body.dataset.modo = 'demo';
  document.body.style.width = `${W}px`;
  document.body.style.margin = '0';
  const palco = document.getElementById('palco');
  const w = await montar(palco, {});
  const relatorio = [];
  const medir = (estado) => {
    const li = palco.querySelector('.li');
    const pt = (e) => `${e.tagName.toLowerCase()}.${(e.className && e.className.baseVal === undefined ? e.className : '').toString().split(' ')[0]}`;
    for (const e of li.querySelectorAll('*')) {
      if (e.closest('svg') || e.closest('.tabela-rolante') || e.closest('.li-formula') || e.closest('.katex-mathml')) continue;
      const r = e.getBoundingClientRect();
      if (r.width && r.right > W + 1) relatorio.push(`${estado}: ${pt(e)} sai do ecrã (direita=${Math.round(r.right)})`);
    }
    for (const t of li.querySelectorAll('.tabela-rolante')) if (t.offsetParent && t.scrollWidth > t.clientWidth + 1) relatorio.push(`${estado}: tabela precisa de rolar (${t.scrollWidth} > ${t.clientWidth})`);
    for (const t of li.querySelectorAll('.li-formula')) if (t.offsetParent && t.scrollWidth > t.clientWidth + 1) relatorio.push(`${estado}: fórmula não cabe (${t.scrollWidth} > ${t.clientWidth})`);
  };
  const painel = (id) => palco.querySelector(`.li-aba[data-aba="${id}"]`);
  w.aba('exp');
  for (const p of [1, 3, 5, 10]) { evento(painel('exp').querySelector('input[id$="-p"]'), p); medir(`exp p=${p}`); }
  evento(painel('exp').querySelector('input[id$="-x"]'), 55); medir('exp p=10 x=max');
  w.aba('ln');
  for (const p of [0.1, 0.25, 0.5, 1, 2]) { chip(painel('ln'), p).click(); medir(`ln p=${p}`); }
  w.aba('xlnx');
  medir('xlnx normal'); chip(painel('xlnx'), 'log').click(); medir('xlnx log');
  w.aba('notaveis');
  for (const k of [-31, -1, 0, 1, 31]) { evento(painel('notaveis').querySelector('input[id$="-x"]'), k); medir(`notaveis k=${k}`); }
  w.aba('assintotas');
  const A = painel('assintotas');
  for (const [fn, sub] of [['f', 'mais'], ['f', 'menos'], ['g', 'zero'], ['g', 'mais']]) {
    chip(A, fn).click(); chip(A, sub).click(); medir(`assintotas ${fn} ${sub}`);
  }
  document.documentElement.dataset.estouro = relatorio.length ? 'sim' : 'nao';
  document.getElementById('resultado').style.display = 'block';
  document.getElementById('resultado').textContent = relatorio.length ? relatorio.join('\n') : `sem estouros a ${W}px`;
  document.documentElement.dataset.demo = 'pronto';
}

// ---------------------------------------------------------------- arranque
async function correr() {
  const saida = document.getElementById('resultado');
  try {
    testarFormatacao();
    testarTabelas();
    testarCruzamentos();
    testarExtremos();
    await testarWidget();
  } catch (e) {
    falhas.push(`exceção: ${e && e.stack || e}`);
  }
  for (const e of erros) falhas.push(e);
  const texto = falhas.length
    ? `FALHOU: ${falhas.length} de ${n} verificações\n\n${falhas.join('\n')}`
    : `OK: ${n} verificações passaram`;
  saida.textContent = texto;
  document.documentElement.dataset.testes = falhas.length ? 'falhou' : 'ok';
}

if (params.get('estouro')) estouro(); else if (params.get('demo')) demo(); else correr();
