<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testes do verdadeiro ou falso</title>
<!-- Testes do widget logaritmos/widgets/vf.js (verdadeiro ou falso, com figuras de assets/motor/grafico.js).
     Abrir /logaritmos/tests/vf.html ou, sem janela:
       msedge --headless=new --virtual-time-budget=40000 --dump-dom http://127.0.0.1:8820/logaritmos/tests/vf.html
     O resultado fica em <pre id="resultado"> e em <html data-testes="ok|falhou">.
     Atenção: cada teste apaga o progresso guardado neste browser para este endereço (como os outros testes do site).
     Os testes de «dados reais» e da página a 390 px usam logaritmos/dados/vf/*.json e verdadeiro-falso.html.
     Com ?demo=inicio|figura|fim monta o widget com os dados reais e leva-o a esse estado, para tirar screenshots
     (por exemplo ?demo=figura&id=fun-vf-simetria, ?demo=fim&tema=funcao); detalhes junto da função demo(). -->
<link rel="stylesheet" href="../../assets/katex/katex.min.css">
<link rel="stylesheet" href="../../assets/estilo.css">
<link rel="stylesheet" href="../tema.css">
<link rel="stylesheet" href="../widgets/vf.css">
<style>
  .teste-cab { padding: 1rem 1.25rem 0; }
  #resultado { margin: 0; padding: 0.5rem 1.25rem 1rem; font: 13px/1.4 monospace; white-space: pre-wrap; }
  #palco { opacity: 0.5; }
  body[data-modo="demo"] .teste-cab, body[data-modo="demo"] #resultado { display: none; }
  body[data-modo="demo"] #palco { opacity: 1; }
  .galeria .vf-topo, .galeria .vf-progresso, .galeria .vf-barra, .galeria .vf-enunciado, .galeria .vf-respostas,
  .galeria .vf-veredito, .galeria .vf-expl, .galeria .vf-erro, .galeria .vf-rodape { display: none; }
  .galeria .widget { margin: 0 0 0.4rem; padding: 0.4rem; }
  .galeria .vf-palco { margin: 0; }
  .galeria .vf-resultado { margin: 0; padding: 0.2rem; }
  .gal-id { margin: 0.4rem 0 0; font: 12px monospace; }
</style>
<script src="../../assets/katex/katex.min.js"></script>
<script src="../../assets/katex/auto-render.min.js"></script>
</head>
<body>
<div class="teste-cab"><h1>Testes do verdadeiro ou falso</h1></div>
<pre id="resultado">A correr...</pre>
<main>
  <section class="seccao"><div class="envolve"><div id="palco"></div></div></section>
</main>
<script type="module">
import { GRUPOS } from '../grupos.js';
import * as P from '../../assets/motor/progresso.js';
import * as vf from '../widgets/vf.js';
import { intervalosTex, intervalosNoTexto } from '../widgets/intervalos.js';

const palco = document.getElementById('palco');
const saida = document.getElementById('resultado');
const TRACO_LONGO = String.fromCharCode(0x2014);
const TRACO_CURTO = String.fromCharCode(0x2013);

// ---------- dados de amostra: 6 afirmações, 2 com figura válida e 1 com figura ilegível ----------

const LEGENDA = 'Gráfico de 2 elevado a x: sobe sempre e passa em (0, 1).';
const AFIRMACOES = [
  { id: 't-exp-contradominio', tema: 'exponencial', texto: 'O contradomínio de $f(x)=2^x$ é $\\mathbb{R}^+$.', verdadeira: true,
    explicacao: 'EXPL-contra: uma potência de base positiva nunca é nula nem negativa.',
    figura: { tipo: 'grafico', x: [-3, 3], y: [-1, 9], curvas: [{ expr: '2^x', rotulo: 'y = 2^x' }], retasH: [0],
      pontos: [{ x: 0, y: 1, rotulo: '(0, 1)' }], legenda: LEGENDA } },
  { id: 't-exp-decrescente', tema: 'exponencial', texto: 'Se $a>1$, a função $f(x)=a^x$ é decrescente.', verdadeira: false,
    explicacao: 'EXPL-decresc: com $a>1$ o valor sobe. Por exemplo, $2^1=2$ e $2^2=4$.',
    erroComum: 'ERRO-decresc: confundir a base com o expoente.' },
  { id: 't-log-negativo', tema: 'logaritmo', texto: 'Existe $\\log_2(-4)$.', verdadeira: false,
    explicacao: 'EXPL-neg: nenhuma potência de 2 dá um número negativo.',
    erroComum: 'ERRO-neg: pensar que $2^{-2}=-4$.' },
  { id: 't-log-um', tema: 'logaritmo', texto: 'Para $a>0$ e $a\\neq1$, tem-se $\\log_a 1=0$.', verdadeira: true,
    explicacao: 'EXPL-um: $a^0=1$ para qualquer base.',
    figura: { tipo: 'grafico', x: [-1, 6], y: [-3, 3],
      curvas: [{ expr: 'logb(2, x)', rotulo: 'y = log₂ x' }, { expr: 'logb(1/2, x)', rotulo: 'y = log_½ x' }],
      pontos: [{ x: 1, y: 0, rotulo: '(1, 0)' }], retasV: [0] } },
  { id: 't-pro-soma', tema: 'propriedades', texto: 'Para $x,y>0$, $\\ln(x+y)=\\ln x+\\ln y$.', verdadeira: false,
    explicacao: 'EXPL-soma: com $x=y=1$, $\\ln 2\\approx0{,}69$ mas $\\ln1+\\ln1=0$.',
    erroComum: 'ERRO-soma: «o logaritmo distribui-se pela soma».',
    figura: { tipo: 'grafico', x: [-3, 3], y: [-1, 5], curvas: [{ expr: '2^^x((' }] } },
  { id: 't-pro-produto', tema: 'propriedades', texto: 'Para $x,y>0$, $\\ln(xy)=\\ln x+\\ln y$.', verdadeira: true,
    explicacao: 'EXPL-prod: o logaritmo transforma produtos em somas.' },
];
const POR_ID = new Map(AFIRMACOES.map((a) => [a.id, a]));
const COM_FIGURA = new Set(['t-exp-contradominio', 't-log-um']); // as que desenham mesmo
const DADOS = { vf: { afirmacoes: AFIRMACOES } };

// ---------- infraestrutura ----------

const linhas = [];
let nFalhas = 0;
const t0 = performance.now();
const errosNaoApanhados = [];
window.addEventListener('error', (e) => errosNaoApanhados.push(e.message));
window.addEventListener('unhandledrejection', (e) => errosNaoApanhados.push('promessa: ' + (e.reason && e.reason.message)));

const esperar = (ms = 0) => new Promise((r) => setTimeout(r, ms));
const q = (el, s) => el.querySelector(s);
const qa = (el, s) => [...el.querySelectorAll(s)];
const texto = (el) => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');

const aLimpar = [];
function novoEl() {
  const d = document.createElement('div');
  d.dataset.widget = 'vf';
  palco.append(d);
  aLimpar.push(d);
  return d;
}
function limparTudo() {
  while (aLimpar.length) aLimpar.pop().remove();
}

async function teste(nome, fn) {
  const erros = [];
  let total = 0;
  const ok = (cond, msg) => {
    if (!cond) { total++; if (erros.length < 4) erros.push(msg); }
  };
  try {
    P.apagarTudo();
    await fn(ok);
  } catch (e) {
    total++;
    erros.push('exceção: ' + (e && e.message));
  } finally {
    limparTudo();
  }
  if (total === 0) linhas.push('OK: ' + nome);
  else {
    nFalhas++;
    linhas.push('FALHOU: ' + nome + ' | ' + erros.join(' | ') + (total > erros.length ? ` (+${total - erros.length} falhas)` : ''));
  }
}

/** Todo o progresso atualmente no armazenamento (as secções), ou {} se não houver. */
function lerTudo() {
  try { return JSON.parse(localStorage.getItem('mat100-estudo-v1')) || {}; } catch (e) { return {}; }
}

async function montar(dados = DADOS, semente = 5) {
  const el = novoEl();
  await vf.montar(el, dados, { semente });
  return el;
}
/** Monta com os dados exatamente como vêm (inclui undefined e null, que `montar` trocaria pelos de amostra). */
async function montarCom(dados) {
  const el = novoEl();
  await vf.montar(el, dados, { semente: 5 });
  return el;
}

const idAtual = (el) => { const c = q(el, '.vf-cartao[data-id]'); return c ? c.dataset.id : null; };
const botao = (el, valor) => q(el, `.vf-resp[data-valor="${valor}"]`);
const chipDe = (el, tema) => q(el, `.chip[data-tema="${tema}"]`);

/**
 * Percorre uma ronda inteira. `decidir(a)` devolve o que clicar (true = Verdadeiro); `antes(a, el)` corre
 * antes de responder e `depois(a, el, valor)` logo a seguir. Termina no ecrã final. Devolve os ids pela ordem.
 */
function percorrer(el, decidir, antes = () => {}, depois = () => {}) {
  const vistos = [];
  for (let i = 0; i < 400 && q(el, '.vf-resp'); i++) {
    const id = idAtual(el);
    const a = POR_ID.get(id) || REAIS.get(id);
    vistos.push(id);
    antes(a, el);
    const valor = decidir(a);
    botao(el, valor).click();
    depois(a, el, valor);
    q(el, '.vf-seguinte').click();
  }
  return vistos;
}

const certa = (a) => a.verdadeira;
const errada = (a) => !a.verdadeira;

// dados reais (logaritmos/dados/vf/<grupo>.json), juntos como faz o app.js
const REAIS = new Map();
const DADOS_REAIS = { vf: { afirmacoes: [] } };
for (const g of GRUPOS) {
  try {
    const r = await fetch(`../dados/vf/${g.id}.json`);
    if (!r.ok) continue;
    const d = await r.json();
    for (const a of d.afirmacoes || []) {
      const x = { ...a, tema: a.tema || d.tema || g.id };
      DADOS_REAIS.vf.afirmacoes.push(x);
      REAIS.set(x.id, x);
    }
  } catch (e) { /* ficheiro ainda por escrever ou inválido: conta como vazio, como no app.js */ }
}

// ---------- testes ----------
async function testes() {

  await teste('monta sem exceção: filtros, primeira afirmação e botões', async (ok) => {
    const el = await montar();
    ok(!!q(el, '.widget.vf'), 'falta o .widget.vf');
    const chips = qa(el, '.chip');
    ok(chips.length === 4, `4 filtros (Todos + 3 temas), há ${chips.length}`);
    ok(texto(chips[0]) === 'Todos (6)', 'primeiro filtro: ' + texto(chips[0]));
    const titulo = (id) => GRUPOS.find((g) => g.id === id).titulo;
    ok(texto(chips[1]) === `${titulo('exponencial')} (2)`, 'filtro 1: ' + texto(chips[1]));
    ok(texto(chips[2]) === `${titulo('logaritmo')} (2)`, 'filtro 2: ' + texto(chips[2]));
    ok(texto(chips[3]) === `${titulo('propriedades')} (2)`, 'filtro 3: ' + texto(chips[3]));
    ok(chips.every((c) => c.getAttribute('aria-pressed') === (c.dataset.tema === 'todos' ? 'true' : 'false')), 'só «Todos» está premido no início');
    ok(!!botao(el, true) && !!botao(el, false), 'faltam os botões Verdadeiro e Falso');
    ok(texto(botao(el, true)).startsWith('Verdadeiro') && texto(botao(el, false)).startsWith('Falso'), 'rótulos dos botões');
    ok(texto(q(el, '.vf-contador')) === '1 de 6', 'contador: ' + texto(q(el, '.vf-contador')));
    ok(/Já acertaste à primeira em 0 de 6 afirmações/.test(texto(q(el, '.vf-estat'))), 'frase de progresso: ' + texto(q(el, '.vf-estat')));
    ok(!q(el, '.katex-error'), 'erro de KaTeX');
    ok(!!q(el, '.vf-enunciado .katex'), 'a fórmula do enunciado devia estar renderizada');
  });

  await teste('a figura não existe antes de responder e existe depois (só nas válidas)', async (ok) => {
    const el = await montar();
    const vistas = percorrer(el, certa,
      (a, e) => {
        ok(!q(e, '.vf-fig') && !q(e, 'svg.figura'), `${a.id}: há figura antes de responder`);
        ok(!q(e, '.vf-expl'), `${a.id}: a explicação aparece antes de responder`);
      },
      (a, e) => {
        const fig = q(e, '.vf-fig');
        ok(!!fig === COM_FIGURA.has(a.id), `${a.id}: figura depois de responder = ${!!fig}, esperado ${COM_FIGURA.has(a.id)}`);
        ok(!!q(e, '.vf-expl'), `${a.id}: falta a explicação (a figura ilegível não pode parti-la)`);
        if (fig) {
          const svg = q(fig, 'svg');
          ok(svg.classList.contains('figura') && svg.classList.contains('figura--fixa'), `${a.id}: o svg devia ser figura figura--fixa`);
          ok(svg.getAttribute('role') === 'img', `${a.id}: role`);
          ok(qa(svg, '[data-camada="curvas"] path').every((p) => (p.getAttribute('d') || '').length > 10), `${a.id}: curva vazia`);
          ok(!!q(svg, '[data-camada="pontos"] circle'), `${a.id}: falta o ponto marcado`);
        }
      });
    ok(vistas.length === 6 && new Set(vistas).size === 6, 'a ronda devia mostrar as 6 afirmações uma vez cada: ' + vistas.join(','));
    ok(!!q(el, '.vf-fim'), 'devia acabar no ecrã final');
    ok(!q(el, '.vf-fig'), 'o ecrã final não tem figuras');
  });

  await teste('figura: legenda vira aria-label; sem legenda gera uma descrição; aceita «aria»', async (ok) => {
    const el = await montar();
    percorrer(el, certa, () => {}, (a, e) => {
      const svg = q(e, '.vf-fig svg');
      if (!svg) return;
      const rotulo = svg.getAttribute('aria-label') || '';
      if (a.id === 't-exp-contradominio') ok(rotulo === LEGENDA, 'legenda: ' + rotulo);
      if (a.id === 't-log-um') {
        ok(rotulo.startsWith('Gráfico de y = log₂ x e y = log_½ x.'), 'descrição gerada: ' + rotulo);
        ok(/Reta vertical: x = 0\./.test(rotulo) && /Ponto marcado: \(1; 0\)\./.test(rotulo), 'descrição gerada (retas e pontos): ' + rotulo);
        ok(!/undefined|NaN/.test(rotulo), 'descrição com undefined/NaN');
      }
    });
    const com = (figura) => ({ vf: { afirmacoes: [{ id: 'x-vf-1', tema: 'exponencial', texto: 'T', verdadeira: true, explicacao: 'E', figura }] } });
    const el2 = await montar(com({ tipo: 'grafico', x: [-2, 2], y: [-1, 5], curvas: [{ expr: '2^x' }], aria: 'Texto do campo aria.' }));
    botao(el2, true).click();
    ok(q(el2, '.vf-fig svg').getAttribute('aria-label') === 'Texto do campo aria.', 'o campo «aria» devia servir de legenda');
  });

  await teste('figuras ilegíveis ou fora do contrato são ignoradas (fica só a explicação)', async (ok) => {
    const casos = {
      'expressão ilegível': { tipo: 'grafico', x: [-3, 3], y: [-1, 5], curvas: [{ expr: '2^^x((' }] },
      'curva sem expr': { tipo: 'grafico', x: [-3, 3], y: [-1, 5], curvas: [{ rotulo: 'f' }] },
      'curva fora da janela': { tipo: 'grafico', x: [-3, -1], y: [-1, 5], curvas: [{ expr: 'ln(x)' }] },
      'janela invertida': { tipo: 'grafico', x: [3, -3], y: [-1, 5], curvas: [{ expr: 'x' }] },
      'janela sem y': { tipo: 'grafico', x: [-3, 3], curvas: [{ expr: 'x' }] },
      'ponto sem número': { tipo: 'grafico', x: [-3, 3], y: [-1, 5], curvas: [{ expr: 'x' }], pontos: [{ x: 'a', y: 1 }] },
      'reta vertical sem x': { tipo: 'grafico', x: [-3, 3], y: [-1, 5], retasV: [{ rotulo: 'x = ?' }] },
      'área mal definida': { tipo: 'grafico', x: [-3, 3], y: [-1, 5], area: { expr: 'x', de: 'a', ate: 2 } },
      'tipo que não é gráfico': { tipo: 'barras', x: [0, 1], p: [0.5, 0.5] },
      'figura que não é objeto': 'gráfico',
    };
    for (const [nome, figura] of Object.entries(casos)) {
      const el = await montar({ vf: { afirmacoes: [{ id: 'x-vf-1', tema: 'exponencial', texto: 'T', verdadeira: true, explicacao: 'Explicação visível.', figura }] } });
      botao(el, true).click();
      ok(!q(el, '.vf-fig'), `${nome}: devia ser ignorada`);
      ok(texto(q(el, '.vf-expl')) === 'Explicação visível.', `${nome}: a explicação desapareceu`);
      ok(!!q(el, '.vf-seguinte'), `${nome}: falta o botão para continuar`);
    }
  });

  await teste('figura: curvas, retas, guias, pontos e área; cores diferentes por defeito', async (ok) => {
    const figura = {
      tipo: 'grafico', x: [-2, 6], y: [-2, 6],
      curvas: [{ expr: '2^x', rotulo: 'y = 2^x' }, { expr: 'logb(2, x)', rotulo: 'y = log₂ x' }, { expr: 'x', cor: 'tg' }],
      retas: [{ declive: 1, ordenada: 1, rotulo: 'r' }], retasV: [0, { x: 3, rotulo: 'x = 3' }], retasH: [{ y: 4 }],
      pontos: [{ x: 2, y: 4, rotulo: '(2, 4)' }], area: { expr: 'ln(x)', de: 1, ate: 3 },
    };
    const el = await montar({ vf: { afirmacoes: [{ id: 'x-vf-1', tema: 'funcao', texto: 'T', verdadeira: true, explicacao: 'E', figura }] } });
    ok(!q(el, 'svg.figura'), 'figura antes de responder');
    botao(el, true).click();
    const svg = q(el, '.vf-fig svg');
    ok(!!svg, 'a figura devia desenhar');
    const cores = qa(svg, '[data-camada="curvas"] > path, [data-camada="curvas"] > g > path').map((p) => p.getAttribute('style'));
    ok(cores.length === 3, 'devia haver 3 curvas, há ' + cores.length);
    ok(cores[0].includes('--c-exp') && cores[1].includes('--c-log') && cores[2].includes('--c-tg'), 'cores das curvas: ' + cores.join(' | '));
    ok(qa(svg, '[data-camada="retas"] path').length === 4, 'devia haver 4 retas (1 reta, 2 verticais, 1 horizontal)');
    ok(!!q(svg, '[data-camada="areas"] path') && q(svg, '[data-camada="areas"] path').getAttribute('d').length > 10, 'falta a área');
    const rotulos = qa(svg, 'text').map((t) => t.textContent);
    ok(rotulos.includes('x = 0') && rotulos.includes('x = 3') && rotulos.includes('y = 4'), 'rótulos das guias: ' + rotulos.join(' | '));
    ok(rotulos.includes('y = 2x') && !rotulos.some((t) => t.includes('^')), 'o rótulo «y = 2^x» devia sair sem o sinal ^: ' + rotulos.join(' | '));
    ok(qa(svg, '[data-camada="texto"] tspan[dy]').length >= 1, 'o expoente devia sair num tspan mais alto');
  });

  await teste('figura: expoentes dos rótulos saem em cima (e^x, e^(−x²), (1/2)^x), sem o sinal ^ (rotulos.js)', async (ok) => {
    const figura = {
      tipo: 'grafico', x: [-3, 3], y: [-1, 5],
      curvas: [{ expr: 'exp(x)', rotulo: 'y = e^x' }, { expr: '(1/2)^x', rotulo: 'y = (1/2)^x' }, { expr: 'exp(-x^2)', rotulo: 'y = e^(−x²)' }, { expr: 'exp(-x)', rotulo: 'y = 1 − e^(−x)' }],
    };
    const el = await montar({ vf: { afirmacoes: [{ id: 'x-vf-2', tema: 'funcao', texto: 'T', verdadeira: true, explicacao: 'E', figura }] } });
    botao(el, true).click();
    const textos = qa(q(el, '.vf-fig svg'), '[data-camada="texto"] text');
    const por = new Map(textos.map((t) => [t.textContent, t]));
    for (const esperado of ['y = ex', 'y = (1/2)x', 'y = e−x²', 'y = 1 − e−x']) {
      const t = por.get(esperado);
      ok(!!t, `falta o rótulo «${esperado}» em: ${[...por.keys()].join(' | ')}`);
      ok(!t || !!t.querySelector('tspan[dy]'), `«${esperado}»: o expoente devia estar num tspan mais alto`);
    }
  });

  await teste('figura: rótulos que se sobrepõem são afastados e ficam dentro do desenho', async (ok) => {
  const figura = {
    tipo: 'grafico', x: [-3, 3], y: [-1, 5],
    curvas: [{ expr: '2^x', rotulo: 'y = 2^x' }, { expr: '2^x', rotulo: 'y = 2^x (a mesma)' }, { expr: '2^x+0.05', rotulo: 'y = 2^x + 0,05' }],
    pontos: [{ x: 0, y: 1, rotulo: '(0, 1)' }, { x: 0.05, y: 1.05, rotulo: '(0,05; 1,05)' }],
  };
  const el = await montar({ vf: { afirmacoes: [{ id: 'x-vf-1', tema: 'exponencial', texto: 'T', verdadeira: true, explicacao: 'E', figura }] } });
  botao(el, true).click();
  const svg = q(el, '.vf-fig svg');
  ok(!!svg, 'a figura devia desenhar');
  const vb = svg.viewBox.baseVal; // os rótulos podem sair da zona dos eixos, mas não do desenho (a caixa do texto tem 2 px de folga em cima)
  // os rótulos das curvas e dos pontos (os nomes dos eixos, x e y, também estão na camada do texto e não contam)
  const caixas = qa(svg, '[data-camada="texto"] text').filter((t) => t.getClientRects().length > 0 && t.textContent.length > 1).map((t) => t.getBBox());
  ok(caixas.length === 5, 'devia haver 5 rótulos visíveis, há ' + caixas.length);
  const cruzam = (a, b) => a.x < b.x + b.width - 0.5 && b.x < a.x + a.width - 0.5 && a.y < b.y + b.height - 0.5 && b.y < a.y + a.height - 0.5;
  let sobrepostos = 0;
  caixas.forEach((a, i) => caixas.slice(i + 1).forEach((b) => { if (cruzam(a, b)) sobrepostos++; }));
  ok(sobrepostos === 0, `${sobrepostos} pares de rótulos ainda se sobrepõem`);
  const fora = caixas.filter((b) => !(b.x >= -0.5 && b.y >= -2 && b.x + b.width <= vb.width + 0.5 && b.y + b.height <= vb.height + 0.5));
  ok(fora.length === 0, 'há rótulos fora do desenho: ' + fora.map((b) => [b.x, b.y, b.width, b.height].map(Math.round).join(',')).join(' | ') + ' desenho ' + vb.width + 'x' + vb.height);
});

await teste('as chaves guardadas começam por log- e guardam o certo', async (ok) => {
    const el = await montar();
    const acertadas = [];

// ---------- modo demo (para screenshots): ?demo=inicio | figura | fim ----------
//   figura: &id=<id da afirmação> [&r=errada]   mostra essa afirmação depois de responder (certo por defeito)
//   fim:    [&tema=<id do grupo>] [&falhas=2]   percorre a ronda e pára no ecrã final
//   Usa os dados reais de logaritmos/dados/vf/. Mete <html data-demo="pronto"> no fim.
async function demo(estado, params) {
  document.body.dataset.modo = 'demo';
  P.apagarTudo();
  const el = novoEl();
  el.id = 'vf-demo';
  await vf.montar(el, DADOS_REAIS, { semente: Number(params.get('semente')) || 3 });
  if (params.get('tema')) chipDe(el, params.get('tema')).click();
  if (estado === 'figura') {
    const id = params.get('id');
    for (let i = 0; i < 400 && q(el, '.vf-resp') && idAtual(el) !== id; i++) {
      botao(el, !REAIS.get(idAtual(el)).verdadeira).click(); // as outras falham-se de propósito: não guardam progresso
      q(el, '.vf-seguinte').click();
    }
    const a = REAIS.get(idAtual(el));
    if (a) botao(el, params.get('r') === 'errada' ? !a.verdadeira : a.verdadeira).click();
  }
  if (estado === 'fim') {
    const total = Number(/de (\d+)$/.exec(texto(q(el, '.vf-contador')))[1]);
    const falhas = params.get('falhas') === null ? 2 : Number(params.get('falhas'));
    for (let i = 0; i < total; i++) {
      const a = REAIS.get(idAtual(el));
      botao(el, i < total - falhas ? a.verdadeira : !a.verdadeira).click();
      q(el, '.vf-seguinte').click();
    }
  }
  document.documentElement.dataset.demo = 'pronto';
}

// ?demo=galeria[&de=0&ate=6]: só as figuras das afirmações reais que as têm, uma por cada, já respondidas.
async function galeria(params) {
  document.body.dataset.modo = 'demo';
  document.body.classList.add('galeria');
  P.apagarTudo();
  const todas = [...REAIS.values()].filter((a) => a.figura);
  for (const a of todas.slice(Number(params.get('de')) || 0, Number(params.get('ate')) || todas.length)) {
    const titulo = document.createElement('p');
    titulo.className = 'gal-id';
    titulo.textContent = a.id;
    palco.append(titulo);
    const el = novoEl();
    await vf.montar(el, { vf: { afirmacoes: [a] } });
    botao(el, a.verdadeira).click();
  }
  document.documentElement.dataset.demo = 'pronto';
}

const params = new URLSearchParams(location.search);
if (params.get('demo') === 'galeria') await galeria(params);
else if (params.get('demo')) await demo(params.get('demo'), params);
else await testes();
</script>
</body>
</html>
